<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>camweb · auto</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.4 system-ui, sans-serif; background:#111; color:#eee; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:16px; gap:12px; }
  h1 { font-size:16px; font-weight:600; letter-spacing:.02em; margin:0; color:#aaa; }
  #stage { position:relative; width:100%; max-width:720px; aspect-ratio:4/3; background:#000; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #stage video { width:100%; height:100%; object-fit:cover; display:block; }
  #stage .hint { color:#666; font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button { background:#222; color:#eee; border:1px solid #333; padding:9px 14px; border-radius:8px; font:inherit; cursor:pointer; }
  button:hover { background:#2a2a2a; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { background:#2f6fed; border-color:#2f6fed; color:#fff; }
  #status { color:#888; font-size:13px; min-height:1.2em; text-align:center; max-width:640px; }
  #gallery { color:#7aa2ff; font-size:13px; text-decoration:none; }
  #gallery:hover { text-decoration:underline; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; background:#1c1c1c; border:1px solid #2a2a2a; margin-left:6px; font-size:12px; color:#aaa; }
</style>
</head>
<body>
  <h1>camweb · auto <span id="rec" style="display:none;color:#ff5555">● recording</span></h1>
  <div id="stage"><div class="hint">camera off</div><video id="video" autoplay playsinline muted></video></div>
  <div id="status">idle</div>
  <div class="row">
    <button id="start" class="primary">start &amp; auto-snap</button>
    <button id="stop" disabled>stop</button>
  </div>
  <div class="row">
    <label style="font-size:13px;color:#888">every
      <select id="interval">
        <option value="5">5s</option>
        <option value="10" selected>10s</option>
        <option value="30">30s</option>
        <option value="60">60s</option>
      </select>
    </label>
  </div>
  <a id="gallery" href="/shots" target="_blank">open gallery →</a>

<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  const stage = document.getElementById('stage');
  const statusEl = document.getElementById('status');
  const btnStart = document.getElementById('start');
  const btnStop = document.getElementById('stop');
  const selInt = document.getElementById('interval');
  let stream = null;
  let timer = null;
  let count = 0;
  let busy = false;

  const setStatus = (t) => { statusEl.innerHTML = t; };

  function grabAndUpload() {
    if (!stream || busy) return;
    if (!video.videoWidth) return;
    busy = true;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(async (blob) => {
      if (!blob) { busy = false; return; }
      try {
        const r = await fetch('/snap', { method: 'POST', body: blob, headers: { 'Content-Type': 'image/png' } });
        if (!r.ok) throw new Error('http ' + r.status);
        count++;
        setStatus('live <span class="pill">' + count + ' sent</span> · last ' + new Date().toLocaleTimeString());
      } catch (e) {
        setStatus('upload failed: ' + e.message);
      } finally {
        busy = false;
      }
    }, 'image/png');
  }

  async function start() {
    try {
      setStatus('requesting permission…');
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false,
      });
      video.srcObject = stream;
      const hint = stage.querySelector('.hint');
      if (hint) hint.remove();
      btnStart.disabled = true;
      btnStop.disabled = false;
      document.getElementById('rec').style.display = 'inline';
      setStatus('live · waiting for first frame…');
      setTimeout(() => {
        grabAndUpload();
        const ms = parseInt(selInt.value, 10) * 1000;
        timer = setInterval(grabAndUpload, ms);
      }, 1500);
    } catch (e) {
      setStatus('error: ' + (e.message || e.name));
    }
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
    btnStart.disabled = false;
    btnStop.disabled = true;
    document.getElementById('rec').style.display = 'none';
    setStatus('stopped <span class="pill">' + count + ' total sent</span>');
  }

  btnStart.addEventListener('click', start);
  btnStop.addEventListener('click', stop);
})();
</script>
</body>
</html>
